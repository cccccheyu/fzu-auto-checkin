name: checkin

on:
  schedule:
    # 晚点名窗口 21:30-23:59，迟到线 22:30 → 七次：21:35 首签 / 21:50 兜底 / 22:05 冲不迟到 / 23:00 / 23:05 / 23:30 / 23:55 末班（宁可迟到不缺席；已签到则静默跳过）（北京时间为准）
    # cron 为 UTC 时间，北京时间 = UTC + 8
    - cron: "35 13 * * *"
    - cron: "50 13 * * *"
    - cron: "5 14 * * *"
    - cron: "0 15 * * *"
    - cron: "5 15 * * *"
    - cron: "30 15 * * *"
    - cron: "55 14 * * *"
  workflow_dispatch: {}   # 支持手动触发

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      # 认证配置两种来源，优先级：CONFIG_YAML secret > 仓库内已提交的 config.yaml（私密库场景）
      # secret 内容 = 完整的 config.yaml，两种认证方式任选：
      #   1) user.token: "<免登token>"           （token 方式）
      #   2) user.username / user.password       （学号密码自动登录，token 留空）
      - name: Prepare config (secret overrides committed config)
        env:
          CONFIG_YAML: ${{ secrets.CONFIG_YAML }}
        run: |
          if [ -n "$CONFIG_YAML" ]; then
            echo "$CONFIG_YAML" > config.yaml
            echo "config from CONFIG_YAML secret"
          else
            test -s config.yaml && echo "config from committed config.yaml"
          fi

      - name: Run checkin
        run: python main.py
