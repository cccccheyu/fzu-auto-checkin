name: checkin

on:
  schedule:
    # ⚠️ 晚点名窗口 21:30-23:59（服务器 FEndTime=23:59 关窗），迟到线 22:30。
    #
    # 设计要点（别改回准点十档）：GitHub Actions 的 schedule 会整批延迟。
    # 实测 45 次运行里只有 5 次落在窗口内，其余全被推迟 1.5~5 小时、落到凌晨 00-04 点。
    # 只排准点档必然全灭 → 改用「密集排档」对冲：
    #   北京时间 16:30 起每 30 分钟一档，一直排到 23:55（共 16 档）。
    #   → 无论整批被推迟多久（7 小时以内），必有一档落进 21:35-23:59；
    #     延迟 ≤5 小时时首档落窗不晚于 22:05（迟到线 22:30 之前），更久则可能迟到但不缺勤。
    #   → 窗口外的档位由 main.py 静默跳过（不推送、不打卡），所以多排档不打扰用户。
    #   → 不要加 concurrency：GitHub 只保留 1 个 pending，加了反而让延迟批次丢档。
    # cron 是 UTC 时间，北京时间 = UTC + 8
    - cron: "30 8 * * *"     # BJ 16:30
    - cron: "0 9 * * *"      # BJ 17:00
    - cron: "30 9 * * *"     # BJ 17:30
    - cron: "0 10 * * *"     # BJ 18:00
    - cron: "30 10 * * *"    # BJ 18:30
    - cron: "0 11 * * *"     # BJ 19:00
    - cron: "30 11 * * *"    # BJ 19:30
    - cron: "0 12 * * *"     # BJ 20:00
    - cron: "30 12 * * *"    # BJ 20:30
    - cron: "0 13 * * *"     # BJ 21:00
    - cron: "30 13 * * *"    # BJ 21:30
    - cron: "0 14 * * *"     # BJ 22:00
    - cron: "30 14 * * *"    # BJ 22:30
    - cron: "0 15 * * *"     # BJ 23:00
    - cron: "30 15 * * *"    # BJ 23:30
    - cron: "55 15 * * *"    # BJ 23:55 末班
  workflow_dispatch: {}   # 支持手动触发

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      # 认证配置两种来源，优先级：CONFIG_YAML secret > 仓库内已提交的 config.yaml（私密库场景）
      # secret 内容 = 完整的 config.yaml，两种认证方式任选：
      #   1) user.token: "<免登token>"           （token 方式）
      #   2) user.username / user.password       （学号密码自动登录，token 留空）
      - name: Prepare config (secret overrides committed config)
        env:
          CONFIG_YAML: ${{ secrets.CONFIG_YAML }}
        run: |
          if [ -n "$CONFIG_YAML" ]; then
            echo "$CONFIG_YAML" > config.yaml
            echo "config from CONFIG_YAML secret"
          else
            test -s config.yaml && echo "config from committed config.yaml"
          fi

      - name: Run checkin
        run: python main.py
