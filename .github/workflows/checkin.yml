name: checkin

on:
  schedule:
    # 晚点名窗口 21:30-23:59，迟到线 22:30 → 定在 21:35 / 21:50（北京时间为准）
    # cron 为 UTC 时间，北京时间 = UTC + 8
    - cron: "35 13 * * *"
    - cron: "50 13 * * *"
  workflow_dispatch: {}   # 支持手动触发

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      # CONFIG_YAML secret 内容 = 完整的 config.yaml，两种认证方式任选：
      #   1) user.token: "<免登token>"           （token 方式）
      #   2) user.username / user.password       （学号密码自动登录，token 留空）
      - name: Write config from secrets
        env:
          CONFIG_YAML: ${{ secrets.CONFIG_YAML }}
        run: echo "$CONFIG_YAML" > config.yaml

      - name: Run checkin
        run: python main.py
